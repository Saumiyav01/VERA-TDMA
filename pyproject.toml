[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-tdma"
version = "0.1.0"
description = "Centralized, independently verified TDMA schedule planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.scripts]
vera-tdma = "vera_tdma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
